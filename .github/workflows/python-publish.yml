name: Build and publish Python package

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY
      - name: Test source and build UI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rsync
          uv sync --frozen
          uv pip install simplejpeg==1.9.0
          uv run playwright install --with-deps chromium
          python scripts/frontend.py build
          CHROMIUM="$(uv run python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path)')" uv run pytest -q
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check --strict dist/*
          uv venv /tmp/cameradeck-package-test
          uv pip install --python /tmp/cameradeck-package-test/bin/python dist/*.whl
          /tmp/cameradeck-package-test/bin/python -I scripts/check-package.py
          # Rebuild with neither npm nor Node on PATH, using the bundled UI.
          mkdir /tmp/cameradeck-sdist
          tar -xzf dist/*.tar.gz -C /tmp/cameradeck-sdist
          PATH=/tmp/cameradeck-package-test/bin "$(command -v uv)" build --python /tmp/cameradeck-package-test/bin/python --wheel /tmp/cameradeck-sdist/cameradeck-* --out-dir /tmp/cameradeck-rebuilt
          uv pip install --reinstall --python /tmp/cameradeck-package-test/bin/python /tmp/cameradeck-rebuilt/*.whl
          /tmp/cameradeck-package-test/bin/python -I scripts/check-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/cameradeck/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
