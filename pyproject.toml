[project]
name = "cameradeck"
version = "0.1.0"
description = "Local-first Raspberry Pi camera console built on Picamera2 and libcamera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "waitress>=3,<4",
    "Pillow>=9",
    "numpy>=1.24",
    "av>=18.1.0",
]

# picamera2 and libcamera are apt-installed system packages (not on PyPI):
#   sudo apt install python3-picamera2 python3-libcamera
# The uv venv is created with --system-site-packages so it sees them.

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "playwright>=1.50,<2",
    "black>=24",
    "jsbeautifier>=1.15",
    "cssbeautifier>=1.15",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests/test_app.py"]
pythonpath = ["."]
